name: Portfolio QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-pages:
    name: Static page QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: npm run serve > /tmp/portfolio-serve.log 2>&1 &

      - name: Wait for local static site
        run: npx --yes wait-on http://127.0.0.1:8080

      - name: Run smoke tests
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run qa:smoke

      - name: Run link tests
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run qa:links -- --project=desktop-chrome

      - name: Capture screenshots
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run qa:screenshots -- --project=desktop-chrome

      - name: Upload static Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-playwright-report
          path: qa/playwright-report
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa/screenshots
          if-no-files-found: ignore

  functions:
    name: Cloudflare Functions QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Cloudflare Pages Functions preview
        run: npx --yes wrangler pages dev . --port 8788 > /tmp/wrangler-pages.log 2>&1 &

      - name: Wait for Functions preview
        run: npx --yes wait-on http://127.0.0.1:8788

      - name: Run contact API hardening tests
        env:
          BASE_URL: http://127.0.0.1:8788
        run: npx playwright test qa/tests/contact-api.test.js --project=desktop-chrome

      - name: Upload Functions Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-playwright-report
          path: qa/playwright-report
          if-no-files-found: ignore
